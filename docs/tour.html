<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทริปแบบแอนิเมชัน</title>
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;500;600&family=Noto+Sans+TC:wght@500&family=Noto+Serif+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<style>
:root{color-scheme:dark;--bg:#0b2333;--panel:#0f2e42f2;--line:#ffffff1f;--ink:#f7f1e6;--mute:#a9c3d0;--red:#e2453c;--gold:#f5c451;--teal:#0f3a54}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;position:fixed;inset:0;width:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Sarabun,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;z-index:0;isolation:isolate;background:#dfe6e8}
/* wintery, slightly desaturated real map */
.vignette{position:fixed;inset:0;pointer-events:none;z-index:400;background:radial-gradient(120% 90% at 65% 45%,transparent 55%,#0b233399 100%)}
body.incity 
/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(#0b2333e6,#0b233300);pointer-events:none}
.top>*{pointer-events:auto}
.back{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:#0b2333cc;border:1px solid var(--line);color:var(--gold);font:600 14px Kanit,sans-serif;text-decoration:none}
.brand{font:700 18px Kanit,sans-serif;text-shadow:0 2px 10px #000a}
.brand small{display:block;font:400 12px Sarabun,sans-serif;color:var(--gold)}

/* card */
.card{position:fixed;z-index:650;left:18px;top:76px;bottom:96px;width:min(400px,38vw);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #0008;overflow:hidden;transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
.card.out{opacity:0;transform:translateX(-24px)}
.cover{position:relative;flex:none;height:150px;background:#123 center/cover no-repeat}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 35%,#0f2e42 100%)}
.cover .chips{position:absolute;left:14px;bottom:10px;z-index:1;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--gold);color:#3b2700;font:600 13px Kanit,sans-serif;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.t{background:#0b2333cc;color:var(--ink);border:1px solid var(--line)}
.head{flex:none;padding:10px 16px 6px}
.head h2{margin:0;font:700 24px/1.15 Kanit,sans-serif;text-wrap:balance}
.head .zh{margin:2px 0 0;color:var(--mute);font:500 14px "Noto Sans TC",sans-serif}
.list{position:relative;flex:1;overflow:auto;padding:4px 10px 12px;overscroll-behavior:contain}
.it{display:grid;grid-template-columns:46px 54px 1fr 26px;gap:10px;align-items:center;padding:7px 6px;border-radius:12px;cursor:pointer;transition:background .2s}
.it:hover,.it.act{background:#ffffff14}
.it .tm{color:var(--gold);font:600 14px Kanit,sans-serif;font-variant-numeric:tabular-nums}
.it .ph{width:54px;height:40px;border-radius:8px;background:#1b3d52 center/cover no-repeat;display:grid;place-items:center;font-size:18px}
.it .tx{font-size:14px;line-height:1.35}
.b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font:600 12px Kanit,sans-serif;border:2px solid #fff}
.b.h{background:var(--gold);color:#3b2700}
.ov p{margin:8px 0;color:var(--mute)} .ov b{color:var(--ink)}

/* markers */
.pin{width:30px;height:30px;border-radius:50%;background:var(--red);border:3px solid #fff;color:#fff;font:700 13px Kanit,sans-serif;display:grid;place-items:center;box-shadow:0 4px 12px #0007;transform:scale(0);animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.pin.act{background:var(--gold);color:#3b2700;transform:scale(1.25)!important;animation:none;box-shadow:0 0 0 8px #f5c45155,0 4px 12px #0007}
@keyframes pop{to{transform:scale(1)}}
.star{font-size:30px;line-height:30px;text-align:center;filter:drop-shadow(0 3px 4px #0008)}
.star span{position:absolute;left:30px;top:4px;white-space:nowrap;font:600 13px Kanit,sans-serif;color:#0f3a54;background:#fffd;padding:1px 8px;border-radius:99px}
.city{font:700 15px Kanit,sans-serif;color:#fff;background:#e2453c;border:2px solid #fff;border-radius:99px;padding:2px 10px;white-space:nowrap;box-shadow:0 4px 12px #0007;transform:translate(-10%,-50%);display:inline-block}
.plane{font-size:34px;line-height:34px;filter:drop-shadow(0 4px 6px #0009);transition:none}
.rt{stroke-dasharray:2 12;stroke-linecap:round}
.arc{stroke-dasharray:3 10;stroke-linecap:round}

.seg{display:inline-block;transform:translate(-50%,-50%) scale(0);white-space:nowrap;font:600 12px Kanit,sans-serif;color:#0f3a54;background:#fffffff0;border:1.5px solid #e2453c;border-radius:99px;padding:2px 8px;box-shadow:0 3px 8px #0005;animation:pop2 .4s ease-out forwards}
.seg.act{background:#e2453c;color:#fff;border-color:#fff}
@keyframes pop2{to{transform:translate(-50%,-50%) scale(1)}}
.legs{margin:6px 0 0;font-size:13px;color:var(--mute)}
.storyb{margin-top:8px;min-height:36px;padding:0 12px;font-size:13px;background:#e2453c;border-color:#e2453c;color:#fff}
.storyb:hover{background:#c93a32}
.story-pop .maplibregl-popup-content{padding:0;border-radius:14px;overflow:hidden;background:#0d1530;color:#f7f1e6;box-shadow:0 12px 30px #0009}
.story-pop .maplibregl-popup-content{width:240px}
.story-pop .maplibregl-popup-tip{border-top-color:#0d1530!important}
.sp-img{height:140px;background:#123 center/cover no-repeat}
.sp-t{padding:8px 12px 10px;font:14px/1.4 Sarabun,sans-serif}
.sp-t b{color:#f5c451;font-family:Kanit,sans-serif;margin-right:4px}
@media(max-width:820px){.story-pop .maplibregl-popup-content{width:180px}.sp-img{height:84px}.sp-t{font-size:13px;padding:6px 10px 8px}}

/* ---- motion ---- */
:root{view-transition-name:none}
::view-transition{pointer-events:none}
.card{view-transition-name:card}
.cover{view-transition-name:cover}
.head h2{view-transition-name:ttl}
.vtpic .card,.vtpic .cover,.vtpic .head h2{view-transition-name:none}
::view-transition-group(*){animation-duration:.6s;animation-timing-function:cubic-bezier(.2,.85,.25,1)}
::view-transition-old(card){animation:.2s ease-in both vt-fade}
::view-transition-new(card){animation:.4s .08s ease-out both vt-show}
@keyframes vt-show{from{opacity:0}}
::view-transition-old(ttl){animation:.22s ease-in both vt-out}
::view-transition-new(ttl){animation:.45s .14s cubic-bezier(.2,.85,.25,1) both vt-in}
::view-transition-old(cover){animation:.5s ease both vt-fade}
::view-transition-new(cover){animation:.6s cubic-bezier(.2,.85,.25,1) both vt-zoom}
::view-transition-group(pic){animation-duration:.55s;animation-timing-function:cubic-bezier(.3,1.25,.45,1);z-index:9}
::view-transition-old(pic),::view-transition-new(pic){height:100%;object-fit:cover;border-radius:10px;overflow:hidden}
@keyframes vt-out{to{opacity:0;transform:translateY(-10px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(12px)}}
@keyframes vt-fade{to{opacity:0}}
@keyframes vt-zoom{from{opacity:0;transform:scale(1.06)}}
.cover{overflow:hidden}
.cv{position:absolute;inset:0;background:#123 center/cover no-repeat;animation:kb 1.4s cubic-bezier(.2,.8,.3,1) both}
@keyframes kb{from{transform:scale(1.07)}to{transform:scale(1)}}
.it{animation:itin .5s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0) * 45ms + 120ms)}
@keyframes itin{from{opacity:0;transform:translateX(-14px)}}
.it .ph{transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.it.act .ph{transform:scale(1.08)}
.pin{transition:background .3s,color .3s,box-shadow .3s}
.seg{transition:background .3s,color .3s,border-color .3s}
button{transition:transform .14s,background .2s,color .2s}
button:active{transform:scale(.95)}
.dots{position:relative}
.dots button[aria-current=true]{border-color:#ffffff30}
.pill{position:absolute;left:0;top:0;border:2px solid var(--gold);border-radius:12px;pointer-events:none;opacity:0;box-shadow:0 0 14px #f5c45155;transition:transform .5s cubic-bezier(.3,1.3,.45,1),width .5s cubic-bezier(.3,1.3,.45,1),opacity .3s}
.pill.on{opacity:1}
.prog{display:flex;gap:4px;margin-top:10px;transition:opacity .4s}
.prog.done{opacity:0}
.prog i{flex:1;height:3px;border-radius:3px;background:#ffffff26;overflow:hidden}
.prog b{display:block;height:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform linear}
.prog i.on b{transform:scaleX(1)}
.story-pop .maplibregl-popup-content{transform-origin:50% 100%;animation:spop .5s cubic-bezier(.3,1.45,.5,1) both}
@keyframes spop{from{opacity:0;transform:translateY(10px) scale(.82)}}
.sp-t{animation:vt-in .4s .18s cubic-bezier(.2,.85,.25,1) both}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}.cv,.it,.story-pop .maplibregl-popup-content,.sp-t{animation:none}.pill{transition:none}}
/* controls */
.bar{position:fixed;z-index:700;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:linear-gradient(#0b233300,#0b2333ee 40%);flex-wrap:wrap}
button{font:600 14px Kanit,sans-serif;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid #ffffff30;background:#103c55;color:var(--ink);cursor:pointer}
button:hover{background:#155070}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--gold);color:#3b2700;border-color:var(--gold)}
.dots{display:flex;gap:6px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dots button{padding:0 11px;font-weight:400;flex:none}
.dots button[aria-current=true]{border-color:var(--gold);color:var(--gold)}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-bottom-right{bottom:70px}


/* ===== luxe theme (matches the presentation) ===== */
:root{--bg:#0b1020;--panel:#0d1530eb;--line:#d9b26a33;--ink:#f5ecd7;--mute:#b9b3a3;--gold:#d9b26a;--gold2:#e9cf95;--navy:#141c33;--serif:'Noto Serif Thai',Georgia,serif}
#map{background:#0b1020}
.tl-dark,.tl-light{transition:opacity 1.2s ease}
.tl-light{opacity:0!important;filter:sepia(.32) saturate(.9) brightness(1.04)}
.tl-ref{filter:sepia(.4) saturate(.7) contrast(.9)}
body.incity .tl-ref{opacity:.75!important}
#map .tl-osm{filter:invert(.92) hue-rotate(190deg) saturate(.45) brightness(.8);transition:filter 1.2s}
body.incity #map .tl-osm{filter:sepia(.3) saturate(.6) brightness(1.03)}
#map .tl-dark{filter:sepia(.4) hue-rotate(185deg) saturate(1.6) brightness(.8)}
body.incity .tl-light{opacity:1!important}
body.incity .tl-dark{opacity:0!important}
.vignette{background:radial-gradient(120% 90% at 65% 45%,transparent 55%,#0b102099 100%)}
body.incity .vignette{background:radial-gradient(120% 90% at 65% 45%,transparent 60%,#3a2c1033 100%)}
.top{background:linear-gradient(#0b1020e6,#0b102000)}
.back{background:#0d1530cc;border-color:var(--line);color:var(--gold2);font-weight:500}
.brand{font:500 19px var(--serif);letter-spacing:.01em}
.brand small{font:600 11px Kanit,sans-serif;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 70px #000a}
.cover::after{background:linear-gradient(#0000 30%,#0d1530 100%)}
.chip{background:transparent;color:var(--gold2);border:1px solid var(--gold);font:600 12px Kanit,sans-serif;letter-spacing:.04em}
.chip.t{background:#0b1020aa;color:var(--ink);border-color:#ffffff30}
.head h2{font:500 26px/1.25 var(--serif);color:var(--ink)}
.head .zh{color:var(--gold);opacity:.85}
.legs{color:var(--mute)}
.it:hover,.it.act{background:#d9b26a1c}
.it .tm{color:var(--gold2);font:600 15px var(--serif)}
.it .ph{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background-color:var(--navy);font-size:16px}
.it{grid-template-columns:46px 42px 1fr 26px}
.it .tx{color:var(--ink)}
.b{background:var(--navy);color:var(--gold2);border:1.5px solid var(--gold);font:500 12px var(--serif)}
.b.h{background:var(--gold);color:var(--navy)}
.storyb{background:transparent;border:1px solid var(--gold);color:var(--gold2)}
.storyb:hover{background:#d9b26a22}
.prog b{background:var(--gold)}
/* overview day list */
.ovl{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px}
.ovr{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:4px 8px;border-radius:12px;cursor:pointer;transition:background .2s;animation:itin .5s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0) * 55ms + 150ms)}
.ovr:hover{background:#d9b26a1c}
.ovr .ph{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:var(--navy) center/cover no-repeat}
.ovr b{display:block;font:500 14.5px/1.25 var(--serif);color:var(--ink)}
.ovr small{display:block;font:600 10.5px Kanit,sans-serif;letter-spacing:.2em;color:var(--gold)}
.ovr em{font:400 12px Sarabun,sans-serif;font-style:normal;color:var(--mute);white-space:nowrap}
.ovsum{margin:2px 10px 10px;padding:10px 0 2px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.ovsum b{color:var(--gold2);font-weight:600}
.offw{margin:0 10px 12px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--mute);line-height:1.45}
.offw button{width:100%;margin-bottom:6px;background:transparent;border:1px solid var(--gold);color:var(--gold2);min-height:40px}
.offw button:hover{background:#d9b26a22}.offw button:disabled{opacity:.75;cursor:default}
.offw button.ok{border-color:#6fbf8e;color:#9fdcb4}
.offw .pbar{height:3px;border-radius:3px;background:#ffffff1f;overflow:hidden;margin:-2px 0 6px;display:none}
.offw .pbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.offw.run .pbar{display:block}
/* map marks */
.mpin{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--gold);background:var(--navy) center/cover no-repeat;box-shadow:0 6px 18px #0b102066;position:relative;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.5,.5,1) forwards;transition:box-shadow .3s}
.mpin i{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--navy);border:1.5px solid var(--gold);color:var(--gold2);font:500 11px/17px var(--serif);text-align:center;font-style:normal}
.mpin.act{transform:scale(1.22)!important;animation:none;box-shadow:0 0 0 6px #d9b26a55,0 8px 22px #0b102077}
.mpin.noimg{display:grid;place-items:center;color:var(--gold2);font:500 17px var(--serif)}
.hstar{width:40px;height:40px;border-radius:50%;background:var(--navy) url(img/present/hotel.png) center/58% no-repeat;border:2px solid var(--gold);box-shadow:0 6px 16px #0b102066;position:relative}
.hstar span{position:absolute;left:46px;top:9px;white-space:nowrap;font:500 13px var(--serif);color:var(--navy);background:#fbf6ea;border:1px solid var(--gold);padding:0 9px;border-radius:99px}
.ctag{display:flex;align-items:center;gap:10px;transform:translate(-9px,-9px);white-space:nowrap;pointer-events:none}
.ctag .cd{flex:none;width:18px;height:18px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 0 #e9cf9599;animation:pulse 2.2s ease-out infinite}
.ctag .cn{font:500 17px var(--serif);color:#f5ecd7;text-shadow:0 2px 10px #000c;letter-spacing:.02em}
.ctag .cn small{display:block;font:600 10px Kanit,sans-serif;letter-spacing:.3em;color:var(--gold)}
@keyframes pulse{0%{box-shadow:0 0 0 0 #e9cf9599}80%,100%{box-shadow:0 0 0 18px #e9cf9500}}
body.incity .ctag .cd{animation:none}
.plane2{filter:drop-shadow(0 0 8px #e9cf95aa) drop-shadow(0 4px 6px #0009)}
.plane2 svg{width:36px;height:36px;display:block}
.arcg{filter:drop-shadow(0 0 6px #e9cf95)}
.seg{color:var(--gold2);background:#0d1530f2;border:1px solid var(--gold);font:500 12px Kanit,sans-serif}
.seg.act{background:var(--gold);color:var(--navy);border-color:var(--gold2)}
.story-pop .maplibregl-popup-content{background:#0d1530;border:1px solid var(--gold);color:var(--ink)}

.sp-t{font:500 15px/1.4 var(--serif)}
.sp-t b{color:var(--gold2);font:600 15px var(--serif)}
/* controls */
.bar{background:linear-gradient(#0b102000,#0b1020ee 40%)}
button{background:#0d1530d9;border-color:#ffffff26;font-weight:500}
button:hover{background:#1a2442}
.pri{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:600}
.pri:hover{background:var(--gold2)}
.dots button[aria-current=true]{color:var(--gold2)}
.pill{border-color:var(--gold);box-shadow:0 0 14px #d9b26a55}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-attrib.maplibregl-compact{background:#0b1020aa!important;color:#c9c3b3}
.maplibregl-ctrl-attrib a{color:var(--gold2)!important}
.maplibregl-ctrl-attrib-button{filter:invert(1) sepia(1) saturate(2)}

/* 3D / 2D switch */
.dim{margin-left:auto;display:flex;padding:3px;border-radius:999px;background:#0d1530d9;border:1px solid var(--line)}
.dim button{min-height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--mute);font:600 13px Kanit,sans-serif;letter-spacing:.06em}
.dim button[aria-pressed=true]{background:var(--gold);color:var(--navy)}
@media(max-width:480px){.brand{display:none}.dim button{padding:0 12px}}

/* ===== 3D map extras ===== */
.mk .seg{transform:scale(0);animation-name:pop3}
@media(max-width:820px){.card{transition:max-height .6s cubic-bezier(.2,.8,.25,1),opacity .5s,transform .6s}body.storying .card{max-height:26vh}body.storying .top{opacity:0;transition:opacity .4s}}
@keyframes pop3{to{transform:scale(1)}}
#map{background:#0e1428;transition:background 1.2s}
body.incity #map{background:#f4eee2}
.mk{will-change:transform}
.plane3{position:relative;width:44px;height:44px}
.plane3 .sh{position:absolute;left:50%;top:50%;width:30px;height:12px;margin:-6px 0 0 -15px;border-radius:50%;background:#0008;filter:blur(4px)}
.plane3 .pb{position:absolute;inset:0;filter:drop-shadow(0 0 10px #e9cf95aa)}
.plane3 svg{width:100%;height:100%;display:block}
.trav{width:16px;height:16px;border-radius:50%;background:var(--gold2);border:2px solid #fff;box-shadow:0 0 0 6px #e9cf9555,0 4px 10px #0008;display:grid;place-items:center;font-size:15px;line-height:1}
.trav span{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:20px;filter:drop-shadow(0 2px 3px #0008)}
/* the two of us: head stickers riding the route */
.duo{position:relative;width:96px;height:78px;pointer-events:none;transition:translate .5s cubic-bezier(.3,1.3,.5,1)}
.duo.at{translate:-64px 40px}
.duo .dot{position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--gold2);border:2px solid #fff;box-shadow:0 0 0 5px #e9cf9555,0 3px 8px #0007}
.duo img{position:absolute;bottom:8px;height:58px;width:auto;filter:drop-shadow(0 4px 5px #0007);transform-origin:50% 100%;transition:bottom .35s,height .35s}
.duo .ha{left:2px;z-index:1}
.duo .hb{left:40px;z-index:2}
.duo .veh{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%) scale(0);font-size:42px;line-height:1;filter:drop-shadow(0 3px 4px #0007);transition:transform .35s cubic-bezier(.3,1.5,.5,1);z-index:3}
.duo.walk .ha{animation:bob .38s ease-in-out infinite alternate}
.duo.walk .hb{animation:bob .38s .19s ease-in-out infinite alternate}
.duo.car img{bottom:26px;height:44px}
.duo.car .veh{transform:translateX(-50%) scale(1)}
.duo.car{animation:rumble .25s linear infinite alternate}
.duo.hop img{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
.duo.hop .hb{animation-delay:.08s}

function movePill() { var b = dots.querySelector('button[aria-current=true]'); if (!b) return; pill.style.width = b.offsetWidth + 'px'; pill.style.height = b.offsetHeight + 'px'; pill.style.transform = 'translate(' + b.offsetLeft + 'px,' + b.offsetTop + 'px)'; pill.classList.add('on'); }
function ui() { setTimeout(movePill, 0); dots.querySelectorAll('button').forEach(function (b) { var on = +b.dataset.i === idx; b.setAttribute('aria-current', on); if (on) dots.scrollTo({ left: b.offsetLeft - dots.clientWidth / 2 + b.offsetWidth / 2, behavior: 'smooth' }); }); $('#prev').disabled = idx === 0; }
var autoB = $('#auto');
function stop() { document.body.classList.remove('autoplay'); if (playing) { playing = false; autoB.textContent = '▶ เล่นอัตโนมัติ'; } }
function nxt() { go(idx === D.length - 1 ? 0 : idx + 1); }
function playFrom(i) {
  if (!playing) return;
  go(i, function () {
    if (!playing) return;
    story(function () {
      if (!playing) return;
      if (i >= D.length - 1) { stop(); return; }
      setTimeout(function () { playFrom(i + 1); }, reduce ? 0 : 600);
    });
  });
}
dots.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { stop(); go(+b.dataset.i); } });
$('#next').onclick = function () { stop(); nxt(); };
$('#prev').onclick = function () { stop(); go(idx - 1); };
autoB.onclick = function () { if (playing) { stop(); gen++; closePop(); return; } playing = true; document.body.classList.add('autoplay'); autoB.textContent = '❚❚ หยุด'; playFrom(idx === D.length - 1 ? 0 : idx + 1); };
document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') { stop(); nxt(); } if (e.key === 'ArrowLeft') { stop(); go(idx - 1); } });
addEventListener('resize', function () { movePill(); fitBar(); });
// phones: swipe left / right on the card or the control bar to change day
(function () {
  var sx = 0, sy = 0, st = 0, ok = false;
  function down(e) { var t = e.changedTouches[0]; ok = !e.target.closest('#dots'); sx = t.clientX; sy = t.clientY; st = Date.now(); }
  function up(e) {
    if (!ok) return; var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - st > 800) return;
    stop(); if (dx < 0 && idx < D.length - 1) go(idx + 1); else if (dx > 0 && idx > 0) go(idx - 1);
  }
  ['#card', '.bar'].forEach(function (s) { var el = $(s); if (!el) return; el.addEventListener('touchstart', down, { passive: true }); el.addEventListener('touchend', up, { passive: true }); });
})();
fitBar();
if (SAVE_MODE) setTimeout(function () { saveOffline(true); }, 0);
$('#card').addEventListener('click', function (e) { if (document.body.classList.contains('storying') && innerWidth <= 820 && e.target.closest('.head') && !e.target.closest('button')) document.body.classList.toggle('peek'); });
function foldAttrib() { if (innerWidth <= 820) [].forEach.call(document.querySelectorAll('.maplibregl-ctrl-attrib'), function (a) { a.classList.remove('maplibregl-compact-show'); }); }
map.once('load', foldAttrib); map.once('idle', foldAttrib);


function apply3D(anim) {
  [].forEach.call(document.querySelectorAll('.dim button'), function (b) { b.setAttribute('aria-pressed', (b.dataset.d === '3') === D3); });
  if (D3 && !map.getLayer('b3d') && map.isStyleLoaded()) add3D();
  try { if (map.getLayer('b3d')) map.setLayoutProperty('b3d', 'visibility', D3 ? 'visible' : 'none'); } catch (e) {}
  if (anim) map.easeTo({ pitch: D3 ? (NIGHT ? 35 : 52) : 0, bearing: D3 ? map.getBearing() : 0, duration: reduce ? 0 : 1200, easing: eio });
}
document.querySelector('.dim').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return; var v = b.dataset.d === '3'; if (v === D3) return;
  D3 = v; try { localStorage.setItem('tour3d', v ? '1' : '0'); } catch (er) {} apply3D(true);
});
apply3D(false);
map.on('style.load', function () { ready = true; clearTimeout(fallT); buildPalette(); addLines(); if (D3) add3D(); apply3D(false); NIGHT = null; setNight(true); if (!SAVE_MODE) go(idx); });
})();
</script>
</body>
</html>
